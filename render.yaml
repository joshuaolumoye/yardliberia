services:
  - type: web
    name: yard-liberia
    runtime: static
    staticPublishPath: .
    routes:
      # Keep old   links working, but send visitors to clean URLs.
      - type: redirect
        source: /index 
        destination: /index
        status: 301
      - type: redirect
        source: /contact 
        destination: /contact
        status: 301
      - type: redirect
        source: /program 
        destination: /program
        status: 301
      - type: redirect
        source: /past-project 
        destination: /past-project
        status: 301
      - type: redirect
        source: /service-detail 
        destination: /service-detail
        status: 301
      # Render serves the real files internally for the clean URLs.
      - type: rewrite
        source: /index
        destination: /index 
      - type: rewrite
        source: /contact
        destination: /contact 
      - type: rewrite
        source: /program
        destination: /program 
      - type: rewrite
        source: /past-project
        destination: /past-project 
      - type: rewrite
        source: /service-detail
        destination: /service-detail 
